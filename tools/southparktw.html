<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《南方公园》台配版</title>
  <link rel="stylesheet" href="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.css" />
  <link rel="preconnect" href="https://player.dogecloud.com" />
  <style>
    /* ---------- 基础 ---------- */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background-color: var(--td-bg-color-page, #f3f3f3);
      color: var(--td-text-color-primary, #000);
      transition: background-color .25s ease, color .25s ease;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #app { height: 100%; }

    /* ---------- 整体骨架 ---------- */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---------- 顶栏 ---------- */
    .header {
      flex: 0 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      background-color: var(--td-bg-color-container, #fff);
      border-bottom: 1px solid var(--td-border-level-1-color, #e7e7e7);
      transition: background-color .25s ease, border-color .25s ease;
      z-index: 10;
      overflow: visible;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .logo {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      z-index: 11;
    }
    .header-right > * { flex: 0 0 auto; }

    .mode-text {
      font-size: 13px;
      color: var(--td-text-color-secondary, #666);
      white-space: nowrap;
      line-height: 1;
    }

    /* 图标按钮（暗色切换 & 菜单共用） */
    .icon-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--td-text-color-primary, #000);
      cursor: pointer;
      flex: 0 0 auto;
      position: relative;
      z-index: 1;
      transition: background-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:hover { background-color: var(--td-bg-color-container-hover, #f3f3f3); }

    .theme-wrap,
    .menu-wrap {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      position: relative;
    }
    .menu-wrap { z-index: 12; }

    /* ---------- 主体 ---------- */
    .body-row {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }
    .sider {
      width: 232px;
      flex: 0 0 232px;
      padding: 8px;
      overflow-y: auto;
      background-color: var(--td-bg-color-container, #fff);
      border-right: 1px solid var(--td-border-level-1-color, #e7e7e7);
      transition: background-color .25s ease, border-color .25s ease;
    }
    .sider-title {
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--td-text-color-placeholder, #999);
    }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--td-text-color-primary, #000);
      font-size: 14px;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background-color .2s ease, color .2s ease;
    }
    .nav-item:hover { background-color: var(--td-bg-color-container-hover, #f3f3f3); }
    .nav-item.active {
      background-color: var(--td-brand-color-light, #f2f3ff);
      color: var(--td-brand-color, #0052d9);
      font-weight: 600;
    }
    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: .55;
      flex-shrink: 0;
    }
    .nav-item.active .nav-dot { opacity: 1; }

    /* ---------- 内容区 ---------- */
    .main {
      flex: 1 1 auto;
      min-width: 0;
      overflow-y: auto;
    }
    .page { padding: 20px 24px 32px; }
    .page-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }

    /* 播放器 */
    .player-wrap { width: 100%; }
    .player-panel { width: 100%; }
    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
    }
    .status-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #2c2c2c;
      color: #9a9a9a;
      font-size: 14px;
      z-index: 1;
      text-align: center;
      padding: 12px;
    }
    .status-layer a {
      color: #4a9eff;
      margin-top: 10px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, .25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- 抽屉 ---------- */
    .drawer-body { padding: 8px; }

    /* ---------- 弹窗内容 ---------- */
    .qr-container {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      margin-top: 12px;
    }
    .qr-box {
      text-align: center;
      flex: 1 1 0;
      min-width: 0;
    }
    .qr-box img {
      width: 100%;
      max-width: 130px;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      border-radius: 8px;
      margin: 0 auto 8px;
      display: block;
      background: #fff;
    }
    .qr-box span {
      font-size: 12px;
      color: var(--td-text-color-placeholder, #999);
    }
    .reward-tip {
      margin-bottom: 4px;
      font-size: 14px;
      line-height: 1.6;
    }
    .about-text {
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }
    .about-version {
      margin-top: 16px;
      font-size: 12px;
      color: var(--td-text-color-placeholder, #999);
      text-align: right;
    }

    .mystery-player-wrap { width: 100%; }
    .mystery-player-wrap .player-box { border-radius: 8px; }

    /* ---------- 小屏适配 ---------- */
    @media (max-width: 767px) {
      .page { padding: 14px 14px 24px; }
      .page-title { font-size: 18px; }
      .mode-text { display: none; }
      .header { padding: 0 12px; }
      .header-right { gap: 8px; }

      .t-dialog {
        width: 92vw !important;
        max-width: 92vw;
      }
      .qr-box img {
        max-width: 110px;
        max-height: 170px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="layout">

    <!-- ===== 顶栏 ===== -->
    <header class="header">
      <div class="header-left">
        <button v-if="isMobile" class="icon-btn" @click="drawerVisible = true" aria-label="打开导航">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        </button>
        <span class="logo">《南方公园》台配版</span>
      </div>

      <div class="header-right">
        <span class="mode-text">
          {{ isDark ? '暗色模式' : '亮色模式' }}{{ manual ? '' : ' · 跟随系统' }}
        </span>

        <!-- 暗色模式切换：图标按钮 -->
        <span class="theme-wrap">
          <button
            class="icon-btn"
            :title="isDark ? '切换到亮色模式' : '切换到暗色模式'"
            :aria-label="isDark ? '切换到亮色模式' : '切换到暗色模式'"
            @click="toggleTheme"
          >
            <svg v-if="isDark" viewBox="0 0 24 24" width="20" height="20"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" />
            </svg>
            <svg v-else viewBox="0 0 24 24" width="20" height="20"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </span>

        <!-- 右上角菜单 -->
        <span class="menu-wrap">
          <t-dropdown
            :options="menuOptions"
            placement="bottom-right"
            trigger="click"
            @click="onMenuClick"
          >
            <button class="icon-btn" aria-label="更多菜单" title="更多">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <circle cx="5" cy="12" r="1.9" />
                <circle cx="12" cy="12" r="1.9" />
                <circle cx="19" cy="12" r="1.9" />
              </svg>
            </button>
          </t-dropdown>
        </span>
      </div>
    </header>

    <!-- ===== 主体 ===== -->
    <div class="body-row">

      <!-- 桌面端侧边栏 -->
      <aside v-if="!isMobile" class="sider">
        <div class="sider-title">季度</div>
        <nav class="nav">
          <button
            v-for="(s, i) in seasons"
            :key="s.vcode"
            class="nav-item"
            :class="{ active: activeIndex === i }"
            @click="selectSeason(i)"
          >
            <span class="nav-dot"></span>
            <span>{{ s.label }}</span>
          </button>
        </nav>
      </aside>

      <!-- 内容区 -->
      <main class="main">
        <div class="page">
          <div class="page-header">
            <h2 class="page-title">{{ currentSeason.label }}</h2>
            <t-tag theme="primary" variant="light" size="small">台配版</t-tag>
          </div>

          <div class="player-wrap">
            <div
              v-for="(s, i) in seasons"
              :key="s.vcode"
              v-show="activeIndex === i"
              class="player-panel"
            >
              <div :id="'player_' + s.vcode" class="player-box"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===== 移动端抽屉 ===== -->
  <t-drawer
    v-model:visible="drawerVisible"
    placement="left"
    size="240px"
    :header="false"
    :footer="false"
  >
    <div class="drawer-body">
      <div class="sider-title">季度</div>
      <nav class="nav">
        <button
          v-for="(s, i) in seasons"
          :key="s.vcode"
          class="nav-item"
          :class="{ active: activeIndex === i }"
          @click="selectSeason(i)"
        >
          <span class="nav-dot"></span>
          <span>{{ s.label }}</span>
        </button>
      </nav>
    </div>
  </t-drawer>

  <!-- ===== 海外版弹窗 ===== -->
  <t-dialog
    v-model:visible="mysteryVisible"
    header="海外版"
    :footer="false"
    width="680px"
    destroy-on-close
  >
    <div class="mystery-player-wrap">
      <div id="player_mystery" class="player-box"></div>
    </div>
  </t-dialog>

  <!-- ===== 赞赏弹窗 ===== -->
  <t-dialog
    v-model:visible="rewardVisible"
    header="感谢支持"
    width="400px"
  >
    <div class="reward-tip">如果觉得好用，可以请开发者喝瓶可乐 🥤</div>
    <div class="qr-container">
      <div class="qr-box">
        <img src="https://cnbj3-fusion.fds.api.xiaomi.com/chatbot-prod/multimedia/1282071161/1773685818977-38c40bec7f8076faf51d8fe761601d82.jpg?GalaxyAccessKeyId=AKDFVGPIRVU2J5L22P&Expires=1805229314506&Signature=6F91HwCXuLMMUnA9PO5yRk1Vc3o=" alt="支付宝">
        <span>支付宝</span>
      </div>
      <div class="qr-box">
        <img src="https://cnbj3-fusion.fds.api.xiaomi.com/chatbot-prod/multimedia/1282071161/mm_facetoface_collect_qrcode_1773685779442-4e222ae57be02fd6c650b2ef4ce6be25.png?GalaxyAccessKeyId=AKDFVGPIRVU2J5L22P&Expires=1805229318739&Signature=r/UwZCOyXg0b16tOyrCq2EXcwS0=" alt="微信">
        <span>微信</span>
      </div>
    </div>
    <template #footer>
      <t-button theme="default" @click="rewardVisible = false">关闭</t-button>
      <t-button theme="primary" @click="openAlipay">支付宝跳转</t-button>
    </template>
  </t-dialog>

  <!-- ===== 关于弹窗 ===== -->
  <t-dialog
    v-model:visible="aboutVisible"
    header="关于"
    width="400px"
  >
    <p class="about-text">
      本视频资源来源于互联网，仅用于非商业用途，如有侵权，请联系删除。
    </p>
    <p class="about-version">版本号 3.6.0</p>
    <template #footer>
      <t-button theme="primary" @click="aboutVisible = false">知道了</t-button>
    </template>
  </t-dialog>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.js"></script>
<script>
  const { createApp, ref, computed, watch, nextTick, onMounted, onUnmounted } = Vue;

  /* ==================== 数据与配置 ==================== */
  const SEASONS = [
    { label: '第一季', vcode: '2ef9dd48909dc300', plcode: '6b09b6b8d06b902c' },
    { label: '第二季', vcode: 'bde20bed5c4aa872', plcode: '5ba17ace5a57ed42' },
    { label: '第三季', vcode: '07d05786e3db978e', plcode: '40fe8b96f8965f0f' },
    { label: '第四季', vcode: 'ddd2b7071f4b3b03', plcode: 'b76cab0adfdc26bb' },
    { label: '第五季', vcode: '79c9a63b4fbf60a7', plcode: '550f2e215412ee10' },
    { label: '第六季', vcode: 'eca2d87f979e91f2', plcode: '885ef3811ba6486c' },
    { label: '第七季', vcode: '7d60bf04640c45db', plcode: '1770679e3968fe04' }
  ];

  const MYSTERY_CONFIG = {
    vcode: '42c630916350e060',
    plcode: '5ff442f6b90f4761',
    userId: 14140,
    autoPlay: false,
    plsort: 'name'
  };

  /* ==================== 播放历史 ==================== */
  const HistoryMgr = {
    save: (vcode, time) => localStorage.setItem(`sp_history_${vcode}`, time),
    get: (vcode) => parseFloat(localStorage.getItem(`sp_history_${vcode}`)) || 0
  };

  const app = createApp({
    setup() {
      /* ---------- 季度状态 ---------- */
      const seasons = SEASONS;
      const activeIndex = ref(0);
      const currentSeason = computed(() => seasons[activeIndex.value]);

      /* ---------- 播放器实例（非响应式） ---------- */
      const players = {};
      let sdkLoaded = false;
      let sdkPromise = null;

      /* ---------- 主题 ---------- */
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const isDark = ref(media.matches);
      const manual = ref(false);

      const applyTheme = (dark) => {
        const root = document.documentElement;
        if (dark) root.setAttribute('theme-mode', 'dark');
        else root.removeAttribute('theme-mode');
      };
      applyTheme(isDark.value);
      watch(isDark, (val) => applyTheme(val));

      const toggleTheme = () => {
        isDark.value = !isDark.value;
        manual.value = true;
      };

      const onSystemChange = (e) => {
        if (!manual.value) isDark.value = e.matches;
      };

      /* ---------- 响应式：移动端抽屉 ---------- */
      const isMobile = ref(window.innerWidth < 768);
      const drawerVisible = ref(false);
      const onResize = () => {
        isMobile.value = window.innerWidth < 768;
        if (!isMobile.value) drawerVisible.value = false;
      };

      /* ---------- 弹窗状态 ---------- */
      const mysteryVisible = ref(false);
      const rewardVisible = ref(false);
      const aboutVisible = ref(false);

      /* ---------- 菜单 ---------- */
      const menuOptions = [
        { content: '刷新播放', value: 'refresh' },
        { content: '海外版', value: 'mystery' },
        { content: '赞赏支持', value: 'reward' },
        { content: '关于', value: 'about' }
      ];

      /* ---------- SDK 加载 ---------- */
      const loadSdk = () => {
        if (sdkLoaded) return Promise.resolve();
        if (sdkPromise) return sdkPromise;
        sdkPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://player.dogecloud.com/js/loader?${Date.now()}`;
          script.onload = () => { sdkLoaded = true; resolve(); };
          script.onerror = reject;
          document.head.appendChild(script);
        });
        return sdkPromise;
      };

      /* ---------- 普通季度播放器 ---------- */
      const initPlayer = async (index) => {
        const s = seasons[index];
        const divId = `player_${s.vcode}`;
        const container = document.getElementById(divId);
        if (!container || players[divId]) return;

        if (!navigator.onLine) {
          container.innerHTML = `<div class="status-layer"><p>等待网络恢复...</p></div>`;
          return;
        }

        container.innerHTML = `<div class="status-layer"><div class="loading-spinner"></div><p style="margin-top:10px">加载中...</p></div>`;

        try {
          await loadSdk();
          if (typeof DogePlayer === 'undefined') throw new Error('SDK Error');

          const player = new DogePlayer({
            container: container,
            userId: 14140,
            vcode: s.vcode,
            plcode: s.plcode,
            autoPlay: false,
            plsort: 'name'
          });

          players[divId] = player;

          player.on('ready', () => {
            const saved = HistoryMgr.get(s.vcode);
            if (saved > 2) player.seek(saved);
          });

          player.on('timeupdate', () => {
            const t = player.currentTime || (player.video && player.video.currentTime) || 0;
            if (t > 0) HistoryMgr.save(s.vcode, t);
          });

          player.on('fullscreenchange', (f) => {
            try {
              f ? screen.orientation.lock('landscape') : screen.orientation.unlock();
            } catch (e) { /* 忽略 */ }
          });
        } catch (e) {
          container.innerHTML = `<div class="status-layer"><p>加载失败</p><a onclick="window.initPlayer(${index})">点击重试</a></div>`;
        }
      };

      /* ---------- 海外版播放器 ---------- */
      let mysteryPlayer = null;

      const initMysteryPlayer = async () => {
        const container = document.getElementById('player_mystery');
        if (!container || mysteryPlayer) return;

        if (!navigator.onLine) {
          container.innerHTML = `<div class="status-layer"><p>等待网络恢复...</p></div>`;
          return;
        }

        container.innerHTML = `<div class="status-layer"><div class="loading-spinner"></div><p style="margin-top:10px">加载中...</p></div>`;

        try {
          await loadSdk();
          if (typeof DogePlayer === 'undefined') throw new Error('SDK Error');

          const player = new DogePlayer({
            container: container,
            userId: MYSTERY_CONFIG.userId,
            vcode: MYSTERY_CONFIG.vcode,
            plcode: MYSTERY_CONFIG.plcode,
            autoPlay: MYSTERY_CONFIG.autoPlay,
            plsort: MYSTERY_CONFIG.plsort
          });

          mysteryPlayer = player;

          player.on('ready', () => {
            const saved = HistoryMgr.get(MYSTERY_CONFIG.vcode);
            if (saved > 2) player.seek(saved);
          });

          player.on('timeupdate', () => {
            const t = player.currentTime || (player.video && player.video.currentTime) || 0;
            if (t > 0) HistoryMgr.save(MYSTERY_CONFIG.vcode, t);
          });

          player.on('fullscreenchange', (f) => {
            try {
              f ? screen.orientation.lock('landscape') : screen.orientation.unlock();
            } catch (e) { /* 忽略 */ }
          });
        } catch (e) {
          container.innerHTML = `<div class="status-layer"><p>加载失败</p><a onclick="window.initMysteryPlayer()">点击重试</a></div>`;
        }
      };

      const destroyMysteryPlayer = () => {
        if (mysteryPlayer) {
          try { mysteryPlayer.destroy(); } catch (e) { /* 忽略 */ }
          mysteryPlayer = null;
        }
        const container = document.getElementById('player_mystery');
        if (container) {
          container.innerHTML = `<div class="status-layer"><p>点击打开后加载...</p></div>`;
        }
      };

      watch(mysteryVisible, async (val) => {
        if (val) {
          await nextTick();
          setTimeout(() => initMysteryPlayer(), 300);
        } else {
          destroyMysteryPlayer();
        }
      });

      /* ---------- 网络状态提示（断网/恢复均自动消失） ---------- */
      let offlineNotice = null;     // 断网提示实例
      let onlineNotice = null;      // 恢复提示实例
      let onlineTimer = null;       // 恢复提示的强制关闭定时器

      const closeOfflineNotice = () => {
        if (offlineNotice) {
          try { offlineNotice.close(); } catch (e) { /* 忽略 */ }
          offlineNotice = null;
        }
      };

      const showOfflineNotice = () => {
        if (offlineNotice) return;      // 避免重复叠加
        // 断网提示 3 秒后自动消失，不再一直挂载
        offlineNotice = TDesign.NotifyPlugin.warning({
          title: '网络连接已断开',
          content: '请检查网络后重试',
          duration: 3000,
          placement: 'top-right'
        });
        // 3.1 秒后清理引用（实例已由组件自身关闭）
        setTimeout(() => { offlineNotice = null; }, 3200);
      };

      const showOnlineNotice = () => {
        // 1. 网络恢复：若断网提示还在，立即关闭
        closeOfflineNotice();

        // 2. 清理上一次恢复提示与定时器
        if (onlineTimer) {
          clearTimeout(onlineTimer);
          onlineTimer = null;
        }
        if (onlineNotice) {
          try { onlineNotice.close(); } catch (e) { /* 忽略 */ }
          onlineNotice = null;
        }

        // 3. 显示恢复提示（3 秒后自动消失）
        onlineNotice = TDesign.NotifyPlugin.success({
          title: '网络连接已恢复',
          content: '播放将自动继续',
          duration: 3000,
          placement: 'top-right'
        });

        // 4. 双重保险：3.1 秒后强制关闭并清理引用
        onlineTimer = setTimeout(() => {
          if (onlineNotice) {
            try { onlineNotice.close(); } catch (e) { /* 忽略 */ }
            onlineNotice = null;
          }
          onlineTimer = null;
        }, 3100);
      };

      const onOnline = () => {
        showOnlineNotice();
        initPlayer(activeIndex.value);
        if (mysteryVisible.value && !mysteryPlayer) {
          initMysteryPlayer();
        }
      };

      /* ---------- 交互 ---------- */
      const selectSeason = (i) => {
        activeIndex.value = i;
        if (isMobile.value) drawerVisible.value = false;
        nextTick(() => initPlayer(i));
      };

      const refreshPlayer = () => {
        const s = seasons[activeIndex.value];
        const divId = `player_${s.vcode}`;
        if (players[divId]) {
          try { players[divId].destroy(); } catch (e) { /* 忽略 */ }
          delete players[divId];
        }
        const container = document.getElementById(divId);
        if (container) container.innerHTML = '';
        setTimeout(() => initPlayer(activeIndex.value), 200);
        TDesign.MessagePlugin.success('已刷新');
      };

      const onMenuClick = (data) => {
        const val = data.value;
        if (val === 'refresh') refreshPlayer();
        else if (val === 'mystery') mysteryVisible.value = true;
        else if (val === 'reward') rewardVisible.value = true;
        else if (val === 'about') aboutVisible.value = true;
      };

      const openAlipay = () => {
        window.open('https://qr.alipay.com/tsx19575tdn3azsb7jedp8f', '_blank');
      };

      /* ---------- 生命周期 ---------- */
      onMounted(() => {
        window.initPlayer = initPlayer;
        window.initMysteryPlayer = initMysteryPlayer;

        nextTick(() => initPlayer(0));
        window.addEventListener('resize', onResize);
        window.addEventListener('offline', showOfflineNotice);
        window.addEventListener('online', onOnline);
        media.addEventListener('change', onSystemChange);

        if (!navigator.onLine) showOfflineNotice();
      });

      onUnmounted(() => {
        window.removeEventListener('resize', onResize);
        window.removeEventListener('offline', showOfflineNotice);
        window.removeEventListener('online', onOnline);
        media.removeEventListener('change', onSystemChange);
        if (onlineTimer) clearTimeout(onlineTimer);
      });

      return {
        seasons,
        activeIndex,
        currentSeason,
        isDark,
        manual,
        toggleTheme,
        isMobile,
        drawerVisible,
        mysteryVisible,
        rewardVisible,
        aboutVisible,
        menuOptions,
        onMenuClick,
        selectSeason,
        openAlipay
      };
    }
  });

  app.use(TDesign);
  app.mount('#app');
</script>
</body>
</html>
