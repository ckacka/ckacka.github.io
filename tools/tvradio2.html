<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ckacka数字电视</title>
  <link rel="stylesheet" href="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--td-bg-color-page);
      color: var(--td-text-color-primary);
      overflow: hidden;
      transition: background-color .3s, color .3s;
    }

    #app { height: 100%; display: flex; justify-content: center; }

    .app-container {
      width: 100%;
      max-width: 600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--td-bg-color-page);
      position: relative;
      overflow: hidden;
    }

    /* ---------- 顶栏 ---------- */
    .top-bar {
      flex-shrink: 0;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      background: var(--td-bg-color-container);
      border-bottom: 1px solid var(--td-component-stroke);
      z-index: 10;
    }
    .app-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--td-text-color-primary);
      white-space: nowrap;
    }
    .time-display {
      margin-left: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.3;
    }
    .time-date { font-size: 12px; color: var(--td-text-color-placeholder); }
    .time-clock {
      font-size: 13px;
      font-weight: 600;
      color: var(--td-text-color-primary);
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Tabs 撑满剩余空间 ---------- */
    .main-tabs {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
    }
    .main-tabs .t-tabs__nav-wrap { flex-shrink: 0; }
    .main-tabs .t-tabs__nav { width: 100%; }
    .main-tabs .t-tabs__nav-item { flex: 1 1 0; display: flex; justify-content: center; }

    .main-tabs .t-tabs__content {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .main-tabs .t-tab-panel {
      flex: 1;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ---------- 面板通用 ---------- */
    .panel {
      height: 100%;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel--scroll { overflow-y: auto; }

    /* ---------- 播放器 ---------- */
    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      flex-shrink: 0;
      background: #000;
      border-radius: var(--td-radius-medium, 8px);
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: var(--td-shadow-1);
    }
    .video-box video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .program-title {
      flex-shrink: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--td-brand-color);
      padding: 0 4px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- 频道列表（原生实现，保证一定渲染） ---------- */
    .playlist {
      flex: 1;
      min-height: 180px;
      overflow-y: auto;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-component-stroke);
      border-radius: var(--td-radius-medium, 8px);
      -webkit-overflow-scrolling: touch;
    }
    .channel-item {
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.4;
      color: var(--td-text-color-primary);
      border-bottom: 1px solid var(--td-component-stroke);
      cursor: pointer;
      transition: background .15s;
      user-select: none;
      word-break: break-all;
    }
    .channel-item:last-child { border-bottom: none; }
    .channel-item:hover { background: var(--td-bg-color-container-hover); }
    .channel-item.is-active {
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
      font-weight: 600;
    }

    /* ---------- 直播 / 广播 ---------- */
    .live-container {
      width: 100%;
      height: 400px;
      flex-shrink: 0;
      border-radius: var(--td-radius-medium, 8px);
      overflow: hidden;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-component-stroke);
      box-shadow: var(--td-shadow-1);
    }
    .live-container iframe { display: block; width: 100%; height: 100%; border: none; }

    .radio-container {
      position: relative;
      width: 100%;
      height: 350px;
      flex-shrink: 0;
      border-radius: var(--td-radius-medium, 8px);
      overflow: hidden;
      background: var(--td-bg-color-container);
      border: 1px solid var(--td-component-stroke);
      box-shadow: var(--td-shadow-1);
    }
    .radio-container iframe { display: block; width: 100%; height: 100%; border: none; }

    .refresh-btn { position: absolute; right: 16px; bottom: 16px; z-index: 5; }

    .hint {
      font-size: 12px;
      color: var(--td-text-color-placeholder);
      text-align: center;
      margin-top: 10px;
    }

    /* ---------- 设置项 ---------- */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      font-size: 15px;
      color: var(--td-text-color-primary);
      border-bottom: 1px solid var(--td-component-stroke);
    }
    .setting-row:last-child { border-bottom: none; }

    /* ---------- 公告链接 & 页脚 ---------- */
    .notice-link {
      color: var(--td-brand-color);
      text-decoration: underline;
      font-weight: 500;
      white-space: nowrap;
    }
    .footer {
      flex-shrink: 0;
      text-align: center;
      font-size: 11px;
      color: var(--td-text-color-placeholder);
      padding: 8px;
      background: var(--td-bg-color-page);
    }
  </style>
</head>
<body>
<div id="app">
  <div class="app-container">

    <!-- ================= 顶栏 ================= -->
    <div class="top-bar">
      <t-button variant="text" shape="square" @click="drawerVisible = true" title="打开菜单">
        <template #icon>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </template>
      </t-button>
      <span class="app-title">ckacka数字电视</span>
      <div class="time-display">
        <span class="time-date">{{ dateStr }}</span>
        <span class="time-clock">{{ timeStr }}</span>
      </div>
    </div>

    <!-- ================= 公告 ================= -->
    <t-notice-bar
      marquee
      content="请勿相信本网页任何广告，注意保护个人隐私信息，谨防诈骗。推荐使用 Chrome 浏览器访问。"
    >
      <template #operation>
        <a class="notice-link" href="https://www.google.cn/chrome/index.html" target="_blank">点我下载</a>
      </template>
    </t-notice-bar>

    <!-- ================= 主体 Tabs ================= -->
    <t-tabs v-model="activeTab" theme="card" class="main-tabs">

      <!-- 看节目 -->
      <t-tab-panel value="program" label="看节目">
        <div class="panel">
          <div class="video-box">
            <video
              ref="videoEl"
              controls
              playsinline
              preload="auto"
              :src="currentChannel.url">
            </video>
          </div>

          <div class="program-title">正在播放：{{ currentChannel.name }}</div>

          <!-- 频道列表：原生 div 渲染，保证一定显示 -->
          <div ref="playlistRef" class="playlist">
            <div
              v-for="(ch, index) in channels"
              :key="index"
              class="channel-item"
              :class="{ 'is-active': index === currentIndex }"
              @click="playChannel(index)">
              {{ ch.name }}
            </div>
          </div>
        </div>
      </t-tab-panel>

      <!-- 看直播 -->
      <t-tab-panel value="live" label="看直播">
        <div class="panel panel--scroll">
          <div class="live-container">
            <iframe
              src="https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=8178490&quality=0"
              frameborder="no"
              framespacing="0"
              scrolling="no"
              allowfullscreen="true">
            </iframe>
          </div>
          <p class="hint">直播内容来自 Bilibili，请确保网络畅通</p>
        </div>
      </t-tab-panel>

      <!-- 听广播 -->
      <t-tab-panel value="radio" label="听广播">
        <div class="panel panel--scroll">
          <div class="radio-container">
            <iframe :key="radioKey" :src="radioSrc"></iframe>
            <t-button
              class="refresh-btn"
              theme="primary"
              shape="circle"
              title="刷新"
              @click="refreshRadio">
              <template #icon>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
              </template>
            </t-button>
          </div>
          <p class="hint">广播内容来自央广网</p>
        </div>
      </t-tab-panel>

    </t-tabs>

    <!-- ================= 页脚 ================= -->
    <div class="footer">本网页仅供个人学习，信息来源于互联网</div>

    <!-- ================= 设置抽屉 ================= -->
    <t-drawer
      v-model:visible="drawerVisible"
      header="设置"
      placement="left"
      size="280px"
      :footer="false">
      <div class="setting-row">
        <span>暗色模式</span>
        <t-switch v-model="darkMode" @change="toggleDark" />
      </div>
    </t-drawer>

  </div>
</div>

    { name: "央视春晚 1985", url: "https://alimov2.a.kwimgs.com/upic/2022/01/31/16/BMjAyMjAxMzExNjAwMDFfNDAzMDAxOTlfNjYyNzMyNTAwMzJfMF8z_b_Be73c5abcbc0eeb2ec9fce6842e1362a4.mp4" },
    { name: "央视春晚 1984", url: "https://alimov2.a.kwimgs.com/upic/2022/01/31/15/BMjAyMjAxMzExNTU5NTRfNDAzMDAxOTlfNjYyNzMyMzg3MTRfMF8z_b_B192356dadbc90d207ba16964d4c2914c.mp4" },
    { name: "央视春晚 1983", url: "https://alimov2.a.kwimgs.com/upic/2022/01/31/15/BMjAyMjAxMzExNTU5MTRfNDAzMDAxOTlfNjYyNzMxNjcwMjBfMF8z_b_Beb3bda599f76c60c463c433ca7460153.mp4" }
  ];

  const app = createApp({
    setup() {
      const activeTab      = ref('program');
      const drawerVisible  = ref(false);
      const darkMode       = ref(false);
      const currentIndex   = ref(0);
      const videoEl        = ref(null);
      const playlistRef    = ref(null);
      const radioKey       = ref(0);
      const radioSrc       = 'https://m.cnr.cn/#/pages/broadcast/broadcast';
      const dateStr        = ref('----年--月--日');
      const timeStr        = ref('--:--:--');

      const currentChannel = computed(() => channels[currentIndex.value] || channels[0]);

      const applyTheme = (dark) => {
        if (dark) {
          document.documentElement.setAttribute('theme-mode', 'dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.removeAttribute('theme-mode');
          localStorage.setItem('theme', 'light');
        }
      };
      const toggleDark = (val) => applyTheme(val);

      let timer = null;
      const pad = (n) => String(n).padStart(2, '0');
      const updateTime = () => {
        const now = new Date();
        dateStr.value = `${now.getFullYear()}年${pad(now.getMonth() + 1)}月${pad(now.getDate())}日`;
        timeStr.value = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      };

      const safePlay = () => {
        const v = videoEl.value;
        if (!v) return;
        v.muted = false;
        const p = v.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {
            v.muted = true;
            v.play().catch(() => {});
          });
        }
      };

      const loadAndPlay = async () => {
        await nextTick();
        const v = videoEl.value;
        if (!v) return;
        try { v.load(); } catch (e) { /* ignore */ }
        safePlay();
      };

      const scrollActiveIntoView = () => {
        nextTick(() => {
          const box = playlistRef.value;
          if (!box) return;
          const el = box.querySelector('.channel-item.is-active');
          if (el && el.scrollIntoView) {
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      };

      const playChannel = (index) => {
        activeTab.value = 'program';
        if (index === currentIndex.value) {
          safePlay();
          scrollActiveIntoView();
          return;
        }
        currentIndex.value = index;
        scrollActiveIntoView();
      };

      watch(currentIndex, () => { loadAndPlay(); });

      watch(activeTab, async (val) => {
        await nextTick();
        const v = videoEl.value;
        if (!v) return;
        if (val === 'program') safePlay();
        else v.pause();
      });

      const refreshRadio = () => { radioKey.value += 1; };

      onMounted(() => {
        if (localStorage.getItem('theme') === 'dark') {
          darkMode.value = true;
          applyTheme(true);
        }
        updateTime();
        timer = setInterval(updateTime, 1000);
        setTimeout(loadAndPlay, 200);
      });

      onUnmounted(() => {
        if (timer) clearInterval(timer);
      });

      return {
        channels,
        currentIndex,
        currentChannel,
        activeTab,
        drawerVisible,
        darkMode,
        dateStr,
        timeStr,
        radioKey,
        radioSrc,
        videoEl,
        playlistRef,
        playChannel,
        refreshRadio,
        toggleDark
      };
    }
  });

  app.use(TDesign);
  app.mount('#app');
</script>
</body>
</html>
