<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>宝贝回家 · 寻亲信息</title>
  <link rel="stylesheet" href="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('baobei_theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.setAttribute('theme-mode', 'dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { background: var(--td-bg-color-page); }

    .app-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--td-text-color-primary);
      white-space: nowrap;
    }

    .page-container { max-width: 960px; margin: 0 auto; }

    .action-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      background: var(--td-bg-color-page);
      border-bottom: 1px solid var(--td-component-stroke);
    }
    .action-bar > .t-button { flex: 1; min-width: 0; }

    .content-body { padding: 16px; }

    .info-card {
      background: var(--td-bg-color-container);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .info-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .photo-section { flex: 0 0 auto; width: 140px; }
    .photo-section img {
      display: block;
      width: 140px;
      height: 187px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--td-bg-color-container-hover);
      border: 1px solid var(--td-component-stroke);
    }

    .detail-section { flex: 1; min-width: 0; }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .name-text {
      font-size: 24px;
      font-weight: 700;
      color: var(--td-text-color-primary);
      word-break: break-word;
      line-height: 1.2;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .info-item {
      display: flex;
      align-items: flex-start;
      font-size: 14px;
      line-height: 1.6;
    }
    .info-label {
      flex: 0 0 84px;
      color: var(--td-text-color-placeholder);
      font-size: 13px;
    }
    .info-value {
      flex: 1;
      min-width: 0;
      color: var(--td-text-color-primary);
      font-weight: 500;
      word-break: break-word;
    }

    .desc-block {
      margin-top: 16px;
      padding: 14px;
      background: var(--td-bg-color-container-hover);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.75;
      color: var(--td-text-color-secondary);
      word-break: break-word;
    }
    .desc-block-label {
      font-size: 12px;
      color: var(--td-text-color-placeholder);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .source-section {
      text-align: center;
      font-size: 12px;
      color: var(--td-text-color-placeholder);
      line-height: 1.7;
      padding: 8px 0;
    }
    .source-section a { color: var(--td-brand-color); text-decoration: none; }

    .sharing-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .sharing-mask-box {
      background: var(--td-bg-color-container);
      padding: 24px 32px;
      border-radius: 12px;
      color: var(--td-text-color-primary);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      min-width: 180px;
    }

    @media (max-width: 767px) {
      .action-bar { padding: 10px 12px; gap: 10px; }
      .content-body { padding: 12px; }
      .info-card { padding: 14px; border-radius: 10px; }
      .info-layout { gap: 14px; }
      .photo-section { width: 100px; }
      .photo-section img { width: 100px; height: 133px; border-radius: 6px; }
      .name-text { font-size: 19px; }
      .name-row { margin-bottom: 10px; gap: 6px; }
      .info-grid { gap: 6px; }
      .info-item { font-size: 13px; }
      .info-label { flex: 0 0 72px; font-size: 12px; }
      .desc-block { font-size: 13px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <t-layout style="height: 100%;">
      <t-header style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px;">
        <span class="app-title">宝贝回家 · 寻亲信息</span>
        <div style="display: flex; align-items: center; gap: 4px;">
          <t-tooltip :content="isDark ? '切换到浅色模式' : '切换到深色模式'">
            <t-button variant="text" shape="square" @click="toggleTheme">
              <t-icon :name="isDark ? 'sunny' : 'moon'" size="20px" />
            </t-button>
          </t-tooltip>
          <t-tooltip content="生成分享海报">
            <t-button variant="text" shape="square" :disabled="initialLoading || sharing" @click="handleShare">
              <t-icon name="share" size="20px" />
            </t-button>
          </t-tooltip>
        </div>
      </t-header>

      <t-content style="overflow-y: auto;">
        <div class="page-container">
          <div class="action-bar">
            <t-button
              size="large"
              theme="primary"
              :loading="loading"
              :disabled="initialLoading"
              @click="fetchBabyInfo"
            >
              <template #icon><t-icon name="refresh" /></template>
              寻找下一位
            </t-button>
            <t-button
              size="large"
              variant="outline"
              :disabled="!baby.url || loading || initialLoading"
              @click="openOriginal"
            >
              <template #icon><t-icon name="link" /></template>
              查看原帖
            </t-button>
          </div>

          <div class="content-body">
            <div class="info-card">
              <div v-if="initialLoading" style="padding: 60px 20px; text-align: center;">
                <t-loading size="32px" text="数据加载中…" />
              </div>

              <template v-else>
                <div class="info-layout">
                  <div class="photo-section">
                    <img
                      :src="baby.photo"
                      :alt="baby.name ? baby.name + ' 照片' : '寻亲照片'"
                      referrerpolicy="no-referrer"
                      @error="onImgError"
                    />
                  </div>

                  <div class="detail-section">
                    <div class="name-row">
                      <span class="name-text">{{ baby.name || '未知' }}</span>
                      <t-space size="6px">
                        <t-tag v-if="baby.category" theme="primary" variant="light" size="small">
                          {{ baby.category }}
                        </t-tag>
                        <t-tag theme="primary" variant="outline" size="small">
                          {{ baby.sex || '未知' }}
                        </t-tag>
                      </t-space>
                    </div>

                    <div class="info-grid">
                      <div class="info-item">
                        <span class="info-label">出生日期</span>
                        <span class="info-value">{{ baby.birthDay || '未知' }}</span>
                      </div>
                      <div class="info-item">
                        <span class="info-label">失踪时间</span>
                        <span class="info-value">{{ baby.lostDay || '未知' }}</span>
                      </div>
                      <div class="info-item">
                        <span class="info-label">失踪地点</span>
                        <span class="info-value">{{ baby.lostAddress || '未知地点' }}</span>
                      </div>
                      <div class="info-item">
                        <span class="info-label">失踪身高</span>
                        <span class="info-value">{{ baby.lostHeight || '未知' }}</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="desc-block">
                  <div class="desc-block-label">特征描述</div>
                  {{ baby.feature || '暂无详细描述' }}
                </div>
              </template>
            </div>

            <div class="source-section">
              数据来源：宝贝回家公益平台 ·
              接口由 <a href="https://www.xunjinlu.fun" target="_blank" rel="noopener">寻鲸录</a> 提供
            </div>
          </div>
        </div>
      </t-content>
    </t-layout>

    <div v-if="sharing" class="sharing-mask">
      <div class="sharing-mask-box">
        <t-loading size="28px" text="正在生成分享海报…" />
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.js"></script>
  <script src="https://unpkg.com/tdesign-icons-vue-next/dist/index.min.js"></script>
  <script>
    const { createApp, ref, reactive, onMounted, onUnmounted } = Vue;

    /* ===================== 工具 ===================== */
    const PLACEHOLDER = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">' +
      '<rect width="300" height="400" fill="#f2f3f5"/>' +
      '<text x="50%" y="50%" font-family="sans-serif" font-size="16" fill="#999" ' +
      'text-anchor="middle" dominant-baseline="middle">暂无照片</text></svg>'
    );

    const API_URL = 'https://api.xunjinlu.fun/api/babygome/index.php';

    function normalizePhotoUrl(url) {
      if (!url || typeof url !== 'string') return PLACEHOLDER;
      let u = url.trim();
      if (!u) return PLACEHOLDER;
      if (u.startsWith('//')) u = 'https:' + u;
      else if (u.startsWith('http://')) u = 'https://' + u.slice(7);
      else if (!/^https?:\/\//i.test(u) && !u.startsWith('data:')) return PLACEHOLDER;
      return u;
    }

    function proxifyImageUrl(url) {
      if (!url || url.startsWith('data:')) return url;
      return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&n=-1';
    }

    function proxifyImageUrlFallback(url) {
      if (!url || url.startsWith('data:')) return url;
      return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    }

    function loadImageWithCors(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);

        if (url.startsWith('data:')) {
          const img = new Image();
          img.onload  = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = url;
          return;
        }

        const candidates = [
          proxifyImageUrl(url),
          proxifyImageUrlFallback(url)
        ];

        let idx = 0;

        const tryNext = () => {
          if (idx >= candidates.length) return resolve(null);
          const src = candidates[idx++];

          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.referrerPolicy = 'no-referrer';

          const timer = setTimeout(() => {
            try { img.src = ''; } catch (e) { /* ignore */ }
            tryNext();
          }, 6000);

          img.onload = () => {
            clearTimeout(timer);
            if (img.naturalWidth > 0 && img.naturalHeight > 0) resolve(img);
            else tryNext();
          };
          img.onerror = () => {
            clearTimeout(timer);
            tryNext();
          };

          img.src = src;
        };

        tryNext();
      });
    }

    function wrapText(ctx, text, maxWidth) {
      const chars = String(text || '').split('');
      const lines = [];
      let line = '';
      for (const ch of chars) {
        if (ch === '\n') { lines.push(line); line = ''; continue; }
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines.length ? lines : [''];
    }

    function ellipsis(ctx, text, maxW) {
      const s = String(text || '');
      if (ctx.measureText(s).width <= maxW) return s;
      let cut = s;
      while (cut.length > 1 && ctx.measureText(cut + '…').width > maxW) {
        cut = cut.slice(0, -1);
      }
      return cut + '…';
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    const FONT_SANS = '"PingFang SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';

    /* ===================== Canvas 绘制海报 ===================== */
    async function drawPoster(baby) {
      let photo = null;
      try {
        photo = await loadImageWithCors(normalizePhotoUrl(baby.photo));
      } catch (e) {
        photo = null;
      }

      const W = 750;
      const PAD = 48;
      const CW = W - PAD * 2;

      const measure = document.createElement('canvas').getContext('2d');
      measure.font = `400 28px ${FONT_SANS}`;
      const featureLines = wrapText(measure, baby.feature || '暂无详细描述', CW - 48);

      const canvas = document.createElement('canvas');
      canvas.width  = W;
      canvas.height = 4000;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, 4000);

      let y = 70;

      /* 顶部品牌 */
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0e5cd9';
      ctx.font = `700 48px ${FONT_SANS}`;
      ctx.fillText('宝 贝 回 家', W / 2, y);

      y += 48;
      ctx.fillStyle = '#888888';
      ctx.font = `400 26px ${FONT_SANS}`;
      ctx.fillText('寻 亲 信 息 · 请帮忙扩散', W / 2, y);

      y += 30;
      ctx.strokeStyle = '#0e5cd9';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(PAD, y);
      ctx.lineTo(W - PAD, y);
      ctx.stroke();

      /* 照片 */
      y += 32;
      if (photo) {
        const photoH = 480;
        const photoW = photoH * 0.75;
        const px = (W - photoW) / 2;
        ctx.save();
        roundRect(ctx, px, y, photoW, photoH, 16);
        ctx.clip();
        ctx.drawImage(photo, px, y, photoW, photoH);
        ctx.restore();
        y += photoH + 32;
      } else {
        const boxH = 160;
        ctx.fillStyle = '#f2f3f5';
        roundRect(ctx, PAD, y, CW, boxH, 12);
        ctx.fill();
        ctx.fillStyle = '#999999';
        ctx.font = `400 26px ${FONT_SANS}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('照片加载失败，请前往原帖查看', W / 2, y + boxH / 2);
        ctx.textBaseline = 'alphabetic';
        y += boxH + 32;
      }

      /* 姓名 + 标签 */
      y += 60;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#1a1a1a';
      ctx.font = `700 44px ${FONT_SANS}`;
      const nameText = baby.name || '未知';
      ctx.fillText(nameText, PAD, y);

      const nameW = ctx.measureText(nameText).width;
      let tagX = PAD + nameW + 24;
      const tagH = 44;
      const tagY = y - 34;
      const tagFont = `500 22px ${FONT_SANS}`;
      ctx.font = tagFont;

      const drawTag = (x, text, bg, fg) => {
        const w = ctx.measureText(text).width + 32;
        ctx.fillStyle = bg;
        roundRect(ctx, x, tagY, w, tagH, tagH / 2);
        ctx.fill();
        ctx.fillStyle = fg;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + 16, tagY + tagH / 2);
        ctx.textBaseline = 'alphabetic';
        return w;
      };

      if (baby.sex) {
        const w = drawTag(tagX, baby.sex, '#e6f2ff', '#0e5cd9');
        tagX += w + 12;
      }
      if (baby.category) {
        ctx.font = tagFont;
        const cat = ellipsis(ctx, baby.category, 200);
        drawTag(tagX, cat, '#fff7e6', '#fa8c16');
      }

      y += 30;

      /* 信息块 */
      y += 8;
      const infoBlockY = y;
      const infoItemH = 64;
      const infoBlockH = infoItemH * 4 + 40;

      ctx.fillStyle = '#f7f8fa';
      roundRect(ctx, PAD, infoBlockY, CW, infoBlockH, 12);
      ctx.fill();

      const items = [
        ['出生日期',   baby.birthDay],
        ['失踪时间',   baby.lostDay],
        ['失踪地点',   baby.lostAddress],
        ['失踪时身高', baby.lostHeight]
      ];
      let iy = infoBlockY + 20;
      items.forEach(([label, value]) => {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#8a8a8a';
        ctx.font = `400 24px ${FONT_SANS}`;
        ctx.fillText(label, PAD + 24, iy + 34);

        ctx.fillStyle = '#1a1a1a';
        ctx.font = `500 26px ${FONT_SANS}`;
        ctx.textAlign = 'right';
        const v = ellipsis(ctx, value || '未知', CW - 160);
        ctx.fillText(v, W - PAD - 24, iy + 34);
        iy += infoItemH;
      });
      y = infoBlockY + infoBlockH + 24;

      /* 特征描述块 */
      const featureBlockY = y;
      const featurePadTop  = 26;
      const featureLabelH  = 32;
      const featureGap     = 14;
      const lineH          = 40;
      const featurePadBot  = 26;
      const featureBlockH  = featurePadTop + featureLabelH + featureGap +
                             featureLines.length * lineH + featurePadBot;

      ctx.fillStyle = '#f7f8fa';
      roundRect(ctx, PAD, featureBlockY, CW, featureBlockH, 12);
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#8a8a8a';
      ctx.font = `500 24px ${FONT_SANS}`;
      ctx.fillText('特征描述', PAD + 24, featureBlockY + featurePadTop + 24);

      let fy = featureBlockY + featurePadTop + featureLabelH + featureGap;
      ctx.fillStyle = '#333333';
      ctx.font = `400 28px ${FONT_SANS}`;
      featureLines.forEach(line => {
        fy += lineH;
        ctx.fillText(line, PAD + 24, fy - 8);
      });

      y = featureBlockY + featureBlockH + 40;

      /* 页脚 */
      ctx.strokeStyle = '#e5e5e5';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(PAD, y);
      ctx.lineTo(W - PAD, y);
      ctx.stroke();

      y += 44;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0e5cd9';
      ctx.font = `600 30px ${FONT_SANS}`;
      ctx.fillText('请帮忙扩散，让亲人早日回家', W / 2, y);

      y += 44;
      ctx.fillStyle = '#999999';
      ctx.font = `400 24px ${FONT_SANS}`;
      ctx.fillText('数据来源：宝贝回家公益平台 · baobeihuijia.com', W / 2, y);

      y += 34;
      ctx.fillText('接口支持：寻鲸录 · xunjinlu.fun', W / 2, y);

      /* 裁剪导出 */
      const finalH = Math.ceil(y + 48);
      const out = document.createElement('canvas');
      out.width  = W;
      out.height = finalH;
      out.getContext('2d').drawImage(canvas, 0, 0, W, finalH, 0, 0, W, finalH);

      const blob = await new Promise((resolve, reject) => {
        out.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
      });

      return blob;
    }

    /* ===================== Vue 应用 ===================== */
    const app = createApp({
      setup() {
        const initialLoading = ref(true);
        const loading        = ref(false);
        const sharing        = ref(false);

        const baby = reactive({
          name: '', sex: '', birthDay: '', lostDay: '',
          lostAddress: '', lostHeight: '', feature: '',
          photo: PLACEHOLDER, url: '', category: ''
        });

        /* 主题 */
        const themeKey  = 'baobei_theme';
        const themeMode = ref(localStorage.getItem(themeKey) || 'auto');
        const isDark    = ref(false);

        const applyTheme = () => {
          let dark;
          if (themeMode.value === 'auto') {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            dark = themeMode.value === 'dark';
          }
          isDark.value = dark;
          if (dark) document.documentElement.setAttribute('theme-mode', 'dark');
          else document.documentElement.removeAttribute('theme-mode');
        };

        const toggleTheme = () => {
          themeMode.value = isDark.value ? 'light' : 'dark';
          localStorage.setItem(themeKey, themeMode.value);
          applyTheme();
        };

        applyTheme();

        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const onSystemThemeChange = () => {
          if (themeMode.value === 'auto') applyTheme();
        };

        /* 数据拉取 */
        const fetchBabyInfo = async () => {
          if (loading.value) return;
          loading.value = true;
          try {
            const res = await fetch(
              API_URL + '?type=json&t=' + Date.now(),
              { headers: { 'Accept': 'application/json' } }
            );
            const data = await res.json();

            if (data.code === 200 && data.data) {
              const d = data.data;
              baby.name        = d.name        || '未知';
              baby.sex         = d.sex         || '未知';
              baby.birthDay    = d.birthDay    || '未知';
              baby.lostDay     = d.lostDay     || '未知';
              baby.lostAddress = d.lostAddress || '未知地点';
              baby.lostHeight  = d.lostHeight  || '未知';
              baby.feature     = d.feature     || '暂无详细描述';
              baby.photo       = normalizePhotoUrl(d.photoUrl);
              baby.url         = d.detailUrl   || '';
              baby.category    = d.categoryName || '';
            } else {
              TDesign.MessagePlugin.warning(
                (data && data.msg) ? data.msg : '未获取到有效数据，请重试'
              );
            }
          } catch (err) {
            console.error(err);
            TDesign.MessagePlugin.error('网络请求失败，请检查网络设置');
          } finally {
            loading.value = false;
            initialLoading.value = false;
          }
        };

        const onImgError = (e) => {
          if (e && e.target) e.target.src = PLACEHOLDER;
        };

        const openOriginal = () => {
          if (!baby.url) {
            TDesign.MessagePlugin.warning('该条记录暂无原帖链接');
            return;
          }
          window.open(baby.url, '_blank', 'noopener');
        };

        /* 分享 */
        const handleShare = async () => {
          if (sharing.value || initialLoading.value) return;
          sharing.value = true;
          try {
            const blob = await drawPoster(baby);
            const fileName = '宝贝回家_' + (baby.name || '寻亲') + '.png';
            const file = new File([blob], fileName, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  title: '宝贝回家 · 寻亲信息',
                  text: '请帮忙扩散，让亲人早日回家！',
                  files: [file]
                });
                return;
              } catch (shareErr) {
                if (shareErr && shareErr.name === 'AbortError') return;
              }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            TDesign.MessagePlugin.success('海报已保存到下载目录');
          } catch (err) {
            console.error(err);
            TDesign.MessagePlugin.error('生成海报失败：' + (err.message || '请重试'));
          } finally {
            sharing.value = false;
          }
        };

        onMounted(() => {
          fetchBabyInfo();
          if (mediaQuery.addEventListener) mediaQuery.addEventListener('change', onSystemThemeChange);
          else if (mediaQuery.addListener) mediaQuery.addListener(onSystemThemeChange);
        });
        onUnmounted(() => {
          if (mediaQuery.removeEventListener) mediaQuery.removeEventListener('change', onSystemThemeChange);
          else if (mediaQuery.removeListener) mediaQuery.removeListener(onSystemThemeChange);
        });

        return {
          initialLoading, loading, sharing, baby, isDark, toggleTheme,
          fetchBabyInfo, onImgError, openOriginal, handleShare
        };
      }
    });

    if (window.TDesignIcons && window.TDesignIcons.install) {
      app.use(window.TDesignIcons);
    }
    app.use(TDesign);
    app.mount('#app');
  </script>
</body>
</html>
