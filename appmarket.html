<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>树洞应用市场</title>
  <link rel="stylesheet" href="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.css" />
  <style>
    /* ===== 全局：禁止任何页面级滚动，防止侧边栏被拖动 ===== */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--td-bg-color-page);
      color: var(--td-text-color-primary);
      font-family: var(--td-font-family);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* ===== 根容器：100vh flex column，顶栏永久置顶 ===== */
    #app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== 顶栏 ===== */
    .app-header {
      flex-shrink: 0;
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--td-component-stroke);
      background: var(--td-bg-color-container);
      transition: background-color 0.3s ease, border-color 0.3s ease;
      z-index: 10;
    }
    .app-header h3 { margin: 0; font-weight: 500; font-size: 18px; }
    .header-left { display: flex; align-items: center; gap: 8px; }

    /* ===== 主区域 ===== */
    .app-layout {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex !important;
      flex-direction: row;
    }

    /* ===== 侧边栏 ===== */
    .app-aside {
      flex-shrink: 0 !important;
      width: 270px;
      height: 100%;
      overflow: hidden;
      border-right: 1px solid var(--td-component-stroke);
      background: var(--td-bg-color-container);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .app-aside .t-menu {
      height: 100%;
      overflow: hidden;
    }
    .menu-footer {
      padding: 12px;
      border-top: 1px solid var(--td-component-stroke);
    }

    /* ===== 内容区 ===== */
    .app-content-outer {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
    }
    .app-content-inner {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      padding: 24px;
    }

    /* ===== 卡片网格 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .app-card {
      cursor: pointer;
      height: 100%;
      transition: transform 0.2s ease;
    }
    .app-card:active { transform: scale(0.98); }
    .app-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--td-brand-color-light);
      color: var(--td-brand-color);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
    }
    .app-name { font-size: 14px; font-weight: 500; text-align: center; margin-bottom: 4px; }
    .app-desc { font-size: 12px; text-align: center; color: var(--td-text-color-secondary); line-height: 1.4; min-height: 34px; }

    /* ===== 返回顶部 ===== */
    .back-top.t-button {
      position: fixed;
      right: 24px; bottom: 24px;
      width: 56px; height: 56px;
      padding: 0;
      z-index: 1000;
      box-shadow: var(--td-shadow-3);
    }

    /* ===== 移动端 ===== */
    @media (max-width: 767px) {
      .app-header { padding: 0 16px; }
      .app-content-inner { padding: 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
      .back-top.t-button { right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- 顶栏 -->
  <header class="app-header">
    <div class="header-left">
      <t-button v-if="isMobile" variant="text" shape="square" @click="drawerVisible = true">
        <template #icon><t-icon name="menu" size="22px" /></template>
      </t-button>
      <h3>树洞应用市场</h3>
    </div>
    <t-tooltip :content="isDark ? '切换到浅色模式' : '切换到深色模式'">
      <t-button variant="text" shape="circle" @click="toggleTheme">
        <template #icon><t-icon :name="isDark ? 'sunny' : 'moon'" size="20px" /></template>
      </t-button>
    </t-tooltip>
  </header>

  <t-layout class="app-layout">
    <!-- 侧边栏：带图标 -->
    <t-aside v-if="!isMobile" width="270px" class="app-aside">
      <t-menu v-model="filterCategory" class="aside-menu">
        <t-menu-item v-for="c in categories" :key="c" :value="c">
          <template #icon>
            <t-icon :name="categoryIcons[c] || 'app'" />
          </template>
          {{ c }}
        </t-menu-item>
        <template #operations>
          <div class="menu-footer">
            <t-button variant="outline" block @click="aboutVisible = true">
              <template #icon><t-icon name="info-circle" /></template>
              关于
            </t-button>
          </div>
        </template>
      </t-menu>
    </t-aside>

    <!-- 内容区 -->
    <t-content
      class="app-content-outer"
      style="flex: 1; min-width: 0; overflow: hidden; padding: 0; display: flex; flex-direction: column;"
    >
      <div class="app-content-inner" ref="contentRef" @scroll="onContentScroll">
        <t-input
          v-model="searchText"
          placeholder="搜索应用..."
          clearable
          style="margin-bottom: 20px; max-width: 400px;"
        >
          <template #prefix-icon><t-icon name="search" /></template>
        </t-input>

        <div v-if="filteredTools.length > 0" class="grid">
          <t-card
            v-for="tool in filteredTools"
            :key="tool.id"
            hover-shadow
            class="app-card"
            @click="openApp(tool)"
          >
            <div class="app-icon"><t-icon :name="tool.icon" size="24px" /></div>
            <div class="app-name">{{ tool.name }}</div>
            <div class="app-desc">{{ tool.desc }}</div>
          </t-card>
        </div>
        <t-empty v-else description="未找到相关内容" />
      </div>
    </t-content>
  </t-layout>

  <!-- 移动端抽屉：菜单也带图标 -->
  <t-drawer
    v-model:visible="drawerVisible"
    placement="left"
    :size="270"
    header="分类"
    :footer="false"
    :body-style="{ padding: 0 }"
  >
    <t-menu
      v-model="filterCategory"
      style="height: 100%"
      @change="drawerVisible = false"
    >
      <t-menu-item v-for="c in categories" :key="c" :value="c">
        <template #icon>
          <t-icon :name="categoryIcons[c] || 'app'" />
        </template>
        {{ c }}
      </t-menu-item>
      <template #operations>
        <div class="menu-footer">
          <t-button variant="outline" block @click="openAbout">
            <template #icon><t-icon name="info-circle" /></template>
            关于
          </t-button>
        </div>
      </template>
    </t-menu>
  </t-drawer>

  <!-- 返回顶部 -->
  <t-button
    v-if="showBackTop"
    class="back-top"
    shape="circle"
    theme="primary"
    @click="scrollToTop"
  >
    <template #icon><t-icon name="arrow-up" size="24px" /></template>
  </t-button>

  <!-- 关于弹窗 -->
  <t-dialog
    v-model:visible="aboutVisible"
    header="关于"
    :footer="false"
    :lock="false"
    :width="isMobile ? '90vw' : '320px'"
  >
    <p>树洞应用市场 v3.0</p>
    <p style="color: var(--td-text-color-secondary); font-size: 13px; margin-top: 10px;">
      基于 TDesign 组件库构建，自动跟随系统深色模式，支持手动切换。
    </p>
  </t-dialog>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/tdesign-vue-next/dist/tdesign.min.js"></script>
<script>
  const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

  const toolsData = [
    { id: 1,  name: "百度百科",     desc: "百度百科",     icon: "browse",      category: "百科", url: "https://vhsagj.smartapps.baidu.com/" },
    { id: 2,  name: "芒果TV",       desc: "芒果TV",       icon: "tv",          category: "视频", url: "https://gbmqsu.smartapps.cn/" },
    { id: 3,  name: "新浪新闻",     desc: "新浪新闻",     icon: "file",        category: "新闻", url: "https://05vig8.smartapps.cn/" },
    { id: 4,  name: "番茄时钟",     desc: "番茄时钟",     icon: "time",        category: "工具", url: "https://eiv7ds.smartapps.cn/" },
    { id: 5,  name: "爱奇艺",       desc: "爱奇艺",       icon: "tv",          category: "视频", url: "https://ich5p0.smartapps.cn/" },
    { id: 6,  name: "百度知道",     desc: "百度知道",     icon: "chat",        category: "问答", url: "https://sa93g4.smartapps.baidu.com/" },
    { id: 7,  name: "小红书",       desc: "小红书",       icon: "image",       category: "社交", url: "https://km6pli.smartapps.cn/" },
    { id: 8,  name: "汽车之家",     desc: "汽车之家",     icon: "location",    category: "汽车", url: "https://kj1e9g.smartapps.cn/" },
    { id: 9,  name: "顺丰速递",     desc: "顺丰速递",     icon: "send",        category: "快递", url: "https://exiavs.smartapps.cn/" },
    { id: 10, name: "豆果美食",     desc: "豆果美食",     icon: "shop",        category: "美食", url: "https://wl4c3m.smartapps.cn/" },
    { id: 11, name: "ZAKER新闻",    desc: "ZAKER新闻",    icon: "file",        category: "新闻", url: "https://1qxtps.smartapps.cn/" },
    { id: 12, name: "百度文库",     desc: "百度文库",     icon: "file",        category: "文档", url: "https://6viyij.smartapps.baidu.com/" },
    { id: 13, name: "喜马拉雅",     desc: "喜马拉雅",     icon: "play-circle", category: "音频", url: "https://3ch6m4.smartapps.cn/" },
    { id: 14, name: "当当",         desc: "当当",         icon: "cart",        category: "购物", url: "https://uepcuz.smartapps.cn/" },
    { id: 15, name: "百度汉语诗词", desc: "百度汉语诗词", icon: "file",        category: "教育", url: "https://zpdmxc.smartapps.baidu.com/" },
    { id: 16, name: "携程旅行",     desc: "携程旅行",     icon: "location",    category: "旅游", url: "https://2dn9ap.smartapps.cn/" },
    { id: 17, name: "搜狐网",       desc: "搜狐网",       icon: "file",        category: "新闻", url: "https://2ly4hg.smartapps.cn/" },
    { id: 18, name: "邮编君",       desc: "邮编君",       icon: "location",    category: "工具", url: "https://1yz5q1.smartapps.cn/" },
    { id: 19, name: "爱查快递",     desc: "爱查快递",     icon: "send",        category: "快递", url: "https://f64h5p.smartapps.cn/" },
    { id: 20, name: "圆通速递+",    desc: "圆通速递+",    icon: "send",        category: "快递", url: "https://0b06o1.smartapps.cn/" },
    { id: 21, name: "搜狐视频",     desc: "搜狐视频",     icon: "tv",          category: "视频", url: "https://e84oah.smartapps.cn/" },
    { id: 22, name: "百度作文",     desc: "百度作文",     icon: "edit",        category: "教育", url: "https://nyhqkz.smartapps.baidu.com/" },
    { id: 23, name: "百度贴吧",     desc: "百度贴吧",     icon: "chat",        category: "社交", url: "https://byokpg.smartapps.baidu.com/" },
    { id: 24, name: "新浪微博",     desc: "新浪微博",     icon: "chat",        category: "社交", url: "https://ivomzm.smartapps.cn/" },
    { id: 25, name: "百度股市通",   desc: "百度股市通",   icon: "chart-bar",   category: "金融", url: "https://pqa9p2.smartapps.baidu.com/" },
    { id: 26, name: "百度经验",     desc: "百度经验",     icon: "info-circle", category: "经验", url: "https://7dapi7.smartapps.baidu.com/" },
    { id: 27, name: "风行视频",     desc: "风行视频",     icon: "tv",          category: "视频", url: "https://2wuwzp.smartapps.cn/" },
    { id: 28, name: "马蜂窝",       desc: "马蜂窝",       icon: "location",    category: "旅游", url: "https://r58h90.smartapps.cn/" },
    { id: 29, name: "EMS邮政快递",  desc: "EMS邮政快递",  icon: "send",        category: "快递", url: "https://s1zc8m.smartapps.cn/" },
    { id: 30, name: "京东快递",     desc: "京东快递",     icon: "send",        category: "快递", url: "https://3lasz2.smartapps.cn/" }
  ];

  // 分类 -> TDesign 图标映射
  const categoryIcons = {
    '全部': 'app',
    '百科': 'book',
    '视频': 'video',
    '新闻': 'file',
    '工具': 'tools',
    '问答': 'chat',
    '社交': 'user',
    '汽车': 'location',
    '快递': 'send',
    '美食': 'shop',
    '文档': 'file',
    '音频': 'play-circle',
    '购物': 'cart',
    '教育': 'education',
    '旅游': 'map',
    '金融': 'chart-bar',
    '经验': 'lightbulb'
  };

  const app = createApp({
    setup() {
      const searchText = ref('');
      const filterCategory = ref('全部');
      const isDark = ref(false);
      const showBackTop = ref(false);
      const aboutVisible = ref(false);
      const drawerVisible = ref(false);
      const contentRef = ref(null);

      const mqlLayout = window.matchMedia('(max-width: 767px)');
      const isMobile = ref(mqlLayout.matches);
      const onLayoutChange = (e) => {
        isMobile.value = e.matches;
        if (!e.matches) drawerVisible.value = false;
      };

      const categories = computed(() => ['全部', ...new Set(toolsData.map(t => t.category))]);

      const filteredTools = computed(() => {
        const kw = searchText.value.trim().toLowerCase();
        return toolsData.filter(t => {
          const matchCat = filterCategory.value === '全部' || t.category === filterCategory.value;
          const matchText = !kw || t.name.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw);
          return matchCat && matchText;
        });
      });

      const openApp = (tool) => {
        if (tool.url) window.open(tool.url, '_self');
        else TDesign.MessagePlugin.warning(`应用 ${tool.name} 缺少链接信息。`);
      };

      const openAbout = () => {
        drawerVisible.value = false;
        aboutVisible.value = true;
      };

      const applyTheme = (dark, save = true) => {
        if (dark) document.documentElement.setAttribute('theme-mode', 'dark');
        else document.documentElement.removeAttribute('theme-mode');
        isDark.value = dark;
        if (save) localStorage.setItem('theme', dark ? 'dark' : 'light');
      };
      const toggleTheme = () => applyTheme(!isDark.value, true);

      const onContentScroll = () => {
        const el = contentRef.value;
        if (el) showBackTop.value = el.scrollTop > 300;
      };
      const scrollToTop = () => {
        const el = contentRef.value;
        if (el) el.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const mqlTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const onSystemThemeChange = (e) => {
        if (!localStorage.getItem('theme')) applyTheme(e.matches, false);
      };

      onMounted(() => {
        const stored = localStorage.getItem('theme');
        applyTheme(stored ? stored === 'dark' : mqlTheme.matches, false);
        mqlTheme.addEventListener('change', onSystemThemeChange);
        mqlLayout.addEventListener('change', onLayoutChange);
      });

      onUnmounted(() => {
        mqlTheme.removeEventListener('change', onSystemThemeChange);
        mqlLayout.removeEventListener('change', onLayoutChange);
      });

      return {
        searchText, filterCategory, isDark, showBackTop, aboutVisible, drawerVisible,
        isMobile, contentRef, categories, filteredTools, categoryIcons,
        openApp, openAbout, toggleTheme, scrollToTop, onContentScroll
      };
    }
  });

  app.use(TDesign);
  app.mount('#app');
</script>
</body>
</html>
